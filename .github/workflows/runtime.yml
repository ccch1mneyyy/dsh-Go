# Builds the bundled arm64 runtime (runtime/out/arm64-v8a) on a Linux runner and
# uploads it as an artifact, so test APKs built on any machine can carry the
# runtime that matches the checked-out commit:
#
#   gh workflow run runtime.yml --ref main
#   gh run download <run-id> -n runtime-arm64-v8a -D runtime/out/arm64-v8a
#
# Release builds still follow docs/release.md.
name: Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/runtime.yml']

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Downloads are verified by hash on every run, so a stale cache is harmless.
      - name: Restore the download cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-
      - name: Build the arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a
      - name: Check the bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64
      - name: Save the download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-arm64-v8a
          path: runtime/out/arm64-v8a
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
