# TEMPORARY workflow: build the arm64 runtime for the 1.0.16 release package. Never merge.
# Runs only on pushes to reverse/rc-runtime-3. Does not build libtawcroot.so.
name: reverse-rc-runtime

on:
  push:
    branches: [reverse/rc-runtime-3]

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: arm64 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prefetch official PRoot debs (pinned bytes)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .reverse/rcrt/006-official-proot-cache.sh "$PWD"

      - name: Prefetch locked Ubuntu debs (sha256-checked)
        continue-on-error: true
        run: python3 -I .reverse/rcrt/seed_debs.py "$PWD" arm64

      - name: Build arm64-v8a runtime
        run: |
          start=$(date +%s)
          bash runtime/build-runtime.sh arm64-v8a 2>&1 | tail -60
          echo "RUNTIME build seconds=$(( $(date +%s) - start ))"

      - name: Verify runtime bundle
        run: python3 tooling/check_runtime_bundle.py arm64

      - name: Runtime version
        run: |
          python3 -I -c 'import json,sys; m=json.load(open(sys.argv[1])); print("runtimeVersion=" + m["runtimeVersion"])' \
            runtime/out/arm64-v8a/assets/runtime/manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-runtime-arm64
          path: runtime/out/arm64-v8a
          retention-days: 3
          if-no-files-found: error
