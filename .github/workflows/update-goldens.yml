name: update-goldens

# Temporary: this branch was written on an arm64 phone without a usable
# Flutter toolchain, so the chat-plugins sheet goldens are regenerated here
# and only they are pushed back. Deleted before the PR merges.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-plugins-sheet-ways-in
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: pub get
        working-directory: app
        run: flutter pub get

      - name: analyze
        working-directory: app
        run: flutter analyze

      - name: update goldens
        working-directory: app
        run: flutter test --update-goldens test/plugins/native/chat_plugins_sheet_test.dart

      - name: verify
        working-directory: app
        run: flutter test test/plugins/native/chat_plugins_sheet_test.dart

      - name: commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/test/plugins/native/goldens/
          if git diff --cached --quiet; then
            echo "no golden change"
          else
            git commit -m "test(plugins): 更新插件弹层金图"
            git push
          fi
