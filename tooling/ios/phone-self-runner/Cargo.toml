[package]
name = "dsh-phone-self-runner"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
idevice = { path = ".upstream/idevice", default-features = false, features = ["ring", "tcp", "remote_pairing", "tunnel_tcp_stack", "xctest", "core_device", "display_stream", "mobile_image_mounter", "cryptexd", "springboardservices"] }
libc = "0.2"
plist = "1.8"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "fs", "io-util"] }
# This component emits only its explicit, bounded ABI events. Upstream protocol
# tracing can contain pairing or TSS payloads, including in development builds.
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
strip = "debuginfo"
