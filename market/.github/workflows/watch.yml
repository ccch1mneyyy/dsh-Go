name: Watch npm upgrades
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: market-upgrades
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run watch
      - uses: actions/github-script@v7
        with:
          script: |
            const updates=JSON.parse(await require('node:fs/promises').readFile('reports/updates.json','utf8'));
            const base=(await github.rest.repos.getBranch({...context.repo,branch:'main'})).data.commit.sha;
            if(base!==context.sha) throw new Error('Main changed; rerun against new base');
            for(const u of updates){
              const branch='upgrade/'+require('node:crypto').createHash('sha256').update(u.entry.name+'@'+u.entry.version).digest('hex').slice(0,24);
              const open=await github.rest.pulls.list({...context.repo,head:context.repo.owner+':'+branch,base:'main',state:'open'});
              if(open.data.length){
                await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'check.yml',ref:'main',inputs:{pr:String(open.data[0].number)}});
                continue;
              }
              try {await github.rest.git.createRef({...context.repo,ref:'refs/heads/'+branch,sha:base});} catch(e){if(e.status===422){core.warning('Branch already exists without open PR: '+branch);continue;}throw e;}
              const old=(await github.rest.repos.getContent({...context.repo,path:u.path,ref:base})).data;
              await github.rest.repos.createOrUpdateFileContents({...context.repo,path:u.path,branch,sha:old.sha,message:`Update ${u.entry.name} to ${u.entry.version}`,content:Buffer.from(JSON.stringify(u.entry,null,2)+'\n').toString('base64')});
              const {data:pr}=await github.rest.pulls.create({...context.repo,head:branch,base:'main',title:`Update ${u.entry.name} to ${u.entry.version}`,body:`Pinned upgrade from ${u.from}. The scheduled scanner checked this exact npm tarball. Risk: ${u.report.risk.level}; flags: ${u.report.risk.flags.join(', ') || 'none'}.\n\nDependency advisories and actual host installation integrity are outside this scan.`});
              // workflow_dispatch can be triggered by GITHUB_TOKEN. Reuse the same
              // trusted full-catalog check and protected auto-merge as author PRs.
              await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'check.yml',ref:'main',inputs:{pr:String(pr.number)}});
              core.info(`Created #${pr.number}; full catalog check dispatched`);
            }
